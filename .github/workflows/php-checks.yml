name: PHP syntax and validation checks

on:
  pull_request:
    paths:
      - "**/*.php"
      - ".github/workflows/php-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test Stage 7C registration validation
        run: php tools/test_stage7c.php
